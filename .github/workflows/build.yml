name: Lyra bauen (Android und iPhone)

# main: Tests, Build, APK-Prüfung und Release.
# Andere Branches: Tests, Build und APK-Prüfung, nur als Artefakt, KEIN Release.
on:
  push:
    branches: ['**']
    paths-ignore: ['tool/**', 'server/**', '.github/workflows/diag.yml', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Grundgerüst ergänzen (eigene Dateien bleiben unverändert)
        run: |
          flutter create --platforms=android --org ch.hysen --project-name lyra .
          python3 ci/patch_android.py

      - run: flutter pub get

      - name: Code-Analyse (Fehler brechen ab)
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings lib test 2>&1 | tee analyze.log; then
            msg=$(grep -E "error •" analyze.log | head -30 | sed 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Analyse fehlgeschlagen::$msg"
            exit 1
          fi
          w=$(grep -cE "warning •" analyze.log || true)
          echo "::notice title=Analyse::keine Fehler, $w Warnungen"

      - name: Tests der Wiedergabelogik
        run: |
          set -o pipefail
          if flutter test test/playback_logic_test.dart --reporter expanded 2>&1 | tee pl.log; then
            echo "::notice title=Wiedergabelogik::$(grep -E 'All tests passed|\+[0-9]+' pl.log | tail -1 | sed 's/%/%25/g')"
          else
            msg=$(grep -E "\[E\]|Expected|Actual|Error|FAILED|Some tests failed" pl.log | head -30 | sed 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Wiedergabelogik fehlgeschlagen::$msg"
            exit 1
          fi

      - name: Tests der Update-Logik
        run: |
          set -o pipefail
          if flutter test test/update_logic_test.dart --reporter expanded 2>&1 | tee test.log; then
            echo "::notice title=Tests::$(grep -E 'All tests passed|\+[0-9]+' test.log | tail -1 | sed 's/%/%25/g')"
          else
            msg=$(grep -E "\[E\]|Expected|Actual|Error|FAILED|Some tests failed" test.log | head -30 | sed 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Tests fehlgeschlagen::$msg"
            exit 1
          fi

      - name: Echte YouTube-Music-Antworten holen (Testmaterial)
        uses: actions/checkout@v4
        with:
          ref: ytm-fixtures
          path: ytm-fixtures

      - name: Tests des YouTube-Music-Parsers
        env:
          YTM_FIXTURES: ${{ github.workspace }}/ytm-fixtures
        run: |
          set -o pipefail
          ok=1
          flutter test test/ytmusic_parse_test.dart --reporter expanded 2>&1 | tee ytm.log || ok=0
          [ -f ytm-fixtures/_parse_report.txt ] && { msg=$(sed 's/%/%25/g' ytm-fixtures/_parse_report.txt | cut -c1-400 | awk 'BEGIN{ORS="%0A"}{print}'); echo "::notice title=Parser-Bericht::$msg"; }
          if [ $ok = 0 ]; then
            msg=$(grep -E "Expected|Actual|Error|FAILED|Which|\[E\]|ytmusic" ytm.log | head -40 | sed 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Parser-Tests fehlgeschlagen::$msg"
            exit 1
          fi

      - name: APK bauen
        run: |
          set -o pipefail
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee build.log || {
            grep -nE "Error|error:|^e: |e: file|lib/.*:[0-9]+:[0-9]+|What went wrong|Exception|Could not (find|resolve)" build.log | grep -v "What went wrong" | head -40 > errs.txt || true
            grep -A25 "What went wrong" build.log | head -60 >> errs.txt || true
            [ -s errs.txt ] || tail -60 build.log > errs.txt
            split -l 6 errs.txt chunk_
            for f in chunk_*; do
              msg=$(sed 's/%/%25/g' "$f" | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
            exit 1
          }

      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk Lyra-1.0.${{ github.run_number }}.apk

      - name: APK prüfen (Paket, Version, Signatur)
        run: bash ci/apk_check.sh Lyra-1.0.${{ github.run_number }}.apk ${{ github.run_number }}

      - name: Test-APK als Artefakt (nur Branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-1.0.${{ github.run_number }}-test
          path: Lyra-1.0.${{ github.run_number }}.apk
          retention-days: 14

      - name: Release-Beschreibung erstellen
        run: |
          bash ci/release_notes.sh 1.0.${{ github.run_number }} release_body.md
          msg=$(head -c 3000 release_body.md | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Release-Beschreibung::$msg"

      - name: Release veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lyra 1.0.${{ github.run_number }}
          files: Lyra-1.0.${{ github.run_number }}.apk
          body_path: release_body.md
          make_latest: true

  # iPhone: unsignierte IPA; SideStore signiert sie beim Installieren mit der Apple-ID des Nutzers.
  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS-Grundgerüst ergänzen
        run: |
          flutter create --platforms=ios --org ch.hysen --project-name lyra .
          python3 ci/patch_ios.py

      - run: flutter pub get

      - name: IPA bauen (ohne Signatur)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee build.log || {
            msg=$(grep -E "error|Error|lib/.*:[0-9]+:[0-9]+" build.log | head -40 | sed 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=iOS-Build fehlgeschlagen::$msg"
            exit 1
          }
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Lyra-1.0.${{ github.run_number }}.ipa Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' Payload/Runner.app/Info.plist
          echo "::notice title=IPA::Lyra-1.0.${{ github.run_number }}.ipa, $(du -h Lyra-1.0.${{ github.run_number }}.ipa | cut -f1)"
          python3 ci/sidestore_source.py 1.0.${{ github.run_number }} ${{ github.run_number }} Lyra-1.0.${{ github.run_number }}.ipa ${{ github.repository }}

      - name: Test-IPA als Artefakt (nur Branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-1.0.${{ github.run_number }}-ios-test
          path: |
            Lyra-1.0.${{ github.run_number }}.ipa
            source.json
          retention-days: 14

      - name: IPA und SideStore-Quelle zum Release (nur main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            Lyra-1.0.${{ github.run_number }}.ipa
            source.json
