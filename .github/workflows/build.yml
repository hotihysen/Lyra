name: Lyra APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Grundgerüst ergänzen (eigene Dateien bleiben unverändert)
        run: flutter create --platforms=android --org ch.hysen --project-name lyra .

      - name: Fester Signaturschlüssel, damit Updates über die alte Version installierbar sind
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK bauen
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk Lyra-1.0.${{ github.run_number }}.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lyra 1.0.${{ github.run_number }}
          files: Lyra-1.0.${{ github.run_number }}.apk
          make_latest: true
