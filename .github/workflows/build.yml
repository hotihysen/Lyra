name: Lyra APK bauen

on:
  push:
    branches: [main]
    paths-ignore: ['tool/**', '.github/workflows/diag.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Grundgerüst ergänzen (eigene Dateien bleiben unverändert)
        run: |
          flutter create --platforms=android --org ch.hysen --project-name lyra .
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'androidx.core:core-ktx:1.13.1'\n}\n" >> android/app/build.gradle
          fi

      - name: Fester Signaturschlüssel, damit Updates über die alte Version installierbar sind
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK bauen
        run: |
          set -o pipefail
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee build.log || {
            grep -nE "Error|error:|lib/.*:[0-9]+:[0-9]+|What went wrong|Exception" build.log | head -60 > errs.txt || true
            [ -s errs.txt ] || tail -60 build.log > errs.txt
            split -l 6 errs.txt chunk_
            for f in chunk_*; do
              msg=$(sed 's/%/%25/g' "$f" | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$f::$msg"
            done
            exit 1
          }

      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk Lyra-1.0.${{ github.run_number }}.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lyra 1.0.${{ github.run_number }}
          files: Lyra-1.0.${{ github.run_number }}.apk
          make_latest: true
