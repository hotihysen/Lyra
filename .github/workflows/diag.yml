name: Quellen-Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tool/**']

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          python3 tool/diag2.py || true
          [ -f diag.txt ] || echo "keine Ausgabe" > diag.txt
          split -l 12 diag.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=$f::$msg"
          done
